services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_moxi_new
    ports:
      - "6336:6336"  # REST API
      - "6337:6334"  # gRPC API
    volumes:
      # - ./qdrant/storage:/qdrant/storage
      - ./qdrant_storage_1:/qdrant/storage #<- products data
      # - ./qdrant/snapshots:/qdrant/snapshots
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6336
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

